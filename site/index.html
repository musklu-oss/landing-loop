<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Landing page</title>
  <style>
    :root { --bg: #0f172a; --fg: #f8fafc; --accent: #38bdf8; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 960px; margin: 0 auto; padding: 96px 24px; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 16px; }
    p { font-size: 1.125rem; line-height: 1.6; max-width: 40ch; }
    a.btn { display: inline-block; margin-top: 24px; padding: 12px 24px; border-radius: 8px;
            background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Bun venit</h1>
    <p>Aceasta este pagina de test a sistemului.</p>
    <a class="btn" href="#contact">Contactează-ne</a>
  </main>
</body>
</html>
